<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ request.url_for('static', path='css/style.css') }}">
  </head>
  <body>
    <div class="icon"><h1>MONI<h1></div>
    <h1>Welcome to MONI</h1>
    <h2>MONI is the Main Organisational Networking Interface</h2>
    <p>Please log in as Admin or Worker</p>
    <p>Hint: If you do not know what you are, then you are a Worker</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <label for="role">Role (Admin / Worker):</label>
      <label for="user">User:</label>
      <label for="password">Passwort:</label>
      <input id="role" name="role" required>
      <input id="user" name="user" required>
      <input id="password" name="password" type="password" required>
      <span class="grid-spacer"></span> 
      <span class="grid-spacer"></span> 
      <button type="submit">Login</button>
      
    </form>
  </body>
</html>
