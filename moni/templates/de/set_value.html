<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wert setzen</title>
    <link rel="stylesheet" href="{{ request.url_for('static', path='css/style.css') }}">
  </head>
  <body>
    <div class="icon-moni" onclick="window.location.href='/dashboard'"><h1>MONI<h1></div>
    <h1>Wert setzen</h1>
    <h2>Hier können sie einen Wert für die Artikel im Inventar / Lager setzen.</h2>
    <p>Setzen Sie die Werte sorgfälltig...</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="/set_value">
      <label>Artikel:</label>
      <label>Wert in €:</label>
      <label>Neuer Wert in €:</label>
      <span class="grid-spacer"></span>
      {% for id in assortment %}
        <input id="{{id['item']}}_item" value="{{id['item']}}" readonly>
        <input type="number" id="{{id['item']}}_value" value="{{id['value']}}" readonly>
        <input type="number" name="{{id['item']}}" id="{{id['item']}}_new_value" value="{{id['value']}}" min="0" max="100" step="0.1" required>
        <span class="grid-spacer"></span>
      {% endfor %}
      <span class="grid-spacer"></span> 
      <span class="grid-spacer"></span> 
      <span class="grid-spacer"></span>
      <button type="submit">Wert setzen</button>
    </form>
    <script>
        var element = document.body;
        if (window.sessionStorage.getItem('Mode') === 'dark') {
          element.classList.toggle("dark-mode");
        }
    </script>
  </body>
</html>
