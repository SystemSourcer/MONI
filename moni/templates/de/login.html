<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anmeldung</title>
    <link rel="stylesheet" href="{{ request.url_for('static', path='css/style.css') }}">
  </head>
  <body>
    <div class="icon-moni"><h1>MONI<h1></div>
    <h1>Willkommone bei MONI</h1>
    <h2>MONI ist das Main Organisational Networking Interface</h2>
    <p>Bitte melden Sie sich mit der entsprechenden Rolle an. </p>
    <p>Hinweis: Wenn sie die Rolle nicht kennen, sind sie Austeiler. </p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <label for="role">Rolle:</label>
      <label for="user">Benutzer:</label>
      <label for="password">Passwort:</label>
      <span class="grid-spacer"></span> 
      <select id="role" name="role">
        <option value="master">Meister</option>
        <option value="organizer">Organisator</option>
        <option value="negotiator">Verkäufer</option>
        <option value="issuer">Austeiler</option>
      </select>
      <input id="user" name="user" required>
      <input id="password" name="password" type="password" required>
      <button type="submit">Anmelden</button>  
    </form>
  </body>
</html>
