<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Set Price</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ request.url_for('static', path='css/style.css') }}">
  </head>
  <body>
    <div class="icon-moni" onclick="window.location.href='/dashboard'"><h1>MONI<h1></div>
    <h1>Set Price</h1>
    <h2>Here you can set a price for items in your inventory.</h2>
    <p>Set your prices carefully...</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="/set_price">
      <label>Item:</label>
      <label>Price in €:</label>
      <label>New Price in €:</label>
      <span class="grid-spacer"></span>
      {% for category, idl in inventory.items() %}
        {% for id in idl %}
          <input id="{{id['item']}}_item" value="{{id['item']}}" readonly>
          <input type="number" id="{{id['item']}}_price" value="{{id['price']}}" readonly>
          <input type="number" name="{{id['item']}}" id="{{id['item']}}_new_price" value="{{id['price']}}" min="0" max="100" step="0.1" required>
          <span class="grid-spacer"></span>
        {% endfor %}
      {% endfor %}
      <span class="grid-spacer"></span> 
      <span class="grid-spacer"></span> 
      <span class="grid-spacer"></span>
      <button type="submit">Set Price</button>
    </form>
  </body>
  <script>
      var element = document.body;
      if (window.sessionStorage.getItem('Mode') === 'dark') {
        element.classList.toggle("dark-mode");
      }
  </script>
</html>
