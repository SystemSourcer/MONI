<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Settings</title>
    <link rel="stylesheet" href="{{ request.url_for('static', path='css/style.css') }}">
  </head>
  <body>
    <div class="icon-moni" onclick="window.location.href='/dashboard'"><h1>MONI<h1></div>
    <h1>Settings</h1>
    <h2>Here you can edit the settings</h2>
    <p>Set these values carefully...</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="/settings">
      <label>Setting:</label>
      <label>Value:</label>
      <label>New Value:</label>
      <span class="grid-spacer"></span>
      {% for option, value in settings.items() %}
        <input id="{{ option }}_option" value="{{ option}}" readonly>
        <input id="{{ option }}_value" value="{{ value }}" readonly>
        <input name="{{ option }}" id="{{ option }}_new_price" value="{{ value }}" required>
        <span class="grid-spacer"></span>
      {% endfor %}
      <span class="grid-spacer"></span> 
      <span class="grid-spacer"></span> 
      <span class="grid-spacer"></span>
      <button type="submit">Save Settings</button>
    </form>
    <script>
        var element = document.body;
        if (window.sessionStorage.getItem('Mode') === 'dark') {
          element.classList.toggle("dark-mode");
        }
    </script>
  </body>
</html>
