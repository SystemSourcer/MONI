<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Printer</title>
    <link rel="stylesheet" href="{{ request.url_for('static', path='css/style.css') }}">
  </head>
  <body>
    <div class="icon-moni" onclick="window.location.href='/dashboard'"><h1>MONI<h1></div>
    <h1>Test Printer</h1>
    <h2>Here you can see the configured printers, configuration can be changed in settings.</h2>
    <p>Just touch or click the corresbonding button to test the printer.</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form id="PrinterForm" method="post" action="/test_print">
      {% for printer in printers %}
          <button  style="font-size : 2dvw; width: 20dvw; height: 15dvh;" type="submit" name="address" value="{{printer['address']}}">{{printer['printer']}}<br>{{printer['address']}}</button>
      {% endfor %}
    </form>
    <script>
        var element = document.body;
        if (window.sessionStorage.getItem('Mode') === 'dark') {
          element.classList.toggle("dark-mode");
        }
    </script>
  </body>
</html>
