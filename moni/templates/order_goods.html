<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Order</title>
    <link rel="stylesheet" href="{{ request.url_for('static', path='css/style.css') }}">
  </head>
  <body>
    <div class="icon-moni" onclick="window.location.href='/dashboard'"><h1>MONI<h1></div>
    <h1>Order Goods for: {{place}}</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form class="button-grid">
    {% for category in inventory %}
      {% for item_dict in inventory[category] %}
        {% if item_dict['quantity'] > 0 %}
          <button style="font-size : 2dvw; width: 12dvw; height: 15dvh;" type="button" data-category="{{category}}" data-item="{{ item_dict['item'] }}" data-quantity="{{ item_dict['quantity'] }}" data-ordered="{{ item_dict['ordered'] }}" data-price="{{ item_dict['price'] }}" onclick="clickButton(this.dataset.category, this.dataset.item, this.dataset.quantity, this.dataset.ordered, parseFloat(this.dataset.price))">{{item_dict['item']}}<br>{{item_dict['price']}}€</button>
        {% endif %}
      {% endfor %}
      <hr>
    {% endfor %}
    </form>
    <form id="OrderForm" method="post" action="order_goods">
      <input type="hidden" name="place" value="{{place}}">
      <label>Item:</label>
      <label>Quantity:</label>
      <label>Price in €:</label>
      <label>Custom:</label>
      <hr id="hrForm">
      <span class="grid-spacer"></span> 
      <label>Total in €:</label>
      <input type="text" name="total" value="0" readonly>
      <button type="submit" id="order">Order</button>
    </form>
    <script>
      var element = document.body;
      if (window.sessionStorage.getItem('Mode') === 'dark') {
        element.classList.toggle("dark-mode");
      }
      document.querySelector(`input[name="total"]`).value = "0"
      document.getElementById("order").disabled = true;

    function clickButton(cat, name, max_quantity, ordered, pricePerUnit) {
      const form = document.getElementById('OrderForm');
      // Versuche, ein bestehendes hidden-Input mit diesem Namen zu finden
      let category = document.querySelector(`input[name="${name}_category"]`);
      let item = document.querySelector(`input[name="${name}_item"]`);
      let quantity = document.querySelector(`input[name="${name}_quantity"]`);
      let price = document.querySelector(`input[name="${name}_price"]`);
      let total = document.querySelector(`input[name="total"]`);

      // Falls es noch nicht existiert, anlegen
      if (!item) {
        category = document.createElement('input');
        category.name = `${name}_category`
        category.value = cat;
        category.type = 'hidden'
        item = document.createElement('input');
        item.name = `${name}_item`
        item.value = name;
        quantity = document.createElement('input');
        quantity.type = 'number';
        quantity.name = `${name}_quantity`;  
        quantity.value = "0";
        quantity.min = "1";
        quantity.max = max_quantity - ordered;
        quantity.step = "1";
        price = document.createElement('input');
        price.type = 'text';
        price.name = `${name}_price`;  
        price.value = "0";
        price.readOnly = true;
        custom = document.createElement('input');
        custom.name = `${name}_custom`; 
        form.insertBefore(category, hrForm)
        form.insertBefore(item, hrForm)
        form.insertBefore(quantity, hrForm)
        form.insertBefore(price, hrForm)
        form.insertBefore(custom, hrForm)
        document.getElementById("order").disabled = false;
        // Kopplung nur einmal einrichten:
        let isUpdating = false;

        quantity.addEventListener('input', () => {
          if (isUpdating) return;
          isUpdating = true;
          const q = parseFloat(quantity.value);
          price.value = isNaN(q) ? '' : (q * pricePerUnit).toFixed(2);
          
          let sum = 0;
          const priceFields = document.querySelectorAll(('input[name*="price"]'));
          priceFields.forEach(p => {
            const v = Number(p.value);
            if (!isNaN(v)) {
              sum += v;
            }
          });
          total.value = sum.toFixed(2)

          isUpdating = false;
        });
      }
      // Wert erhöhen
      const current = parseInt(quantity.value || "0", 10);
      quantity.value = Math.min(current + 1, parseInt(max_quantity) - parseInt(ordered));

      const q = parseFloat(quantity.value);
      price.value = isNaN(q) ? '' : (q * pricePerUnit).toFixed(2);

      let sum = 0;
      const priceFields = document.querySelectorAll(('input[name*="price"]'));
      priceFields.forEach(p => {
        const v = Number(p.value);
        if (!isNaN(v)) {
          sum += v;
        }
      });
      total.value = sum.toFixed(2)
    }
    </script>
  </body>
</html>
